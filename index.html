<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bio</title>
<style>
  :root { --primary-color: #a855f7; --purple: #a855f7; --purple-text: #d8b4fe; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
  html, body { height: 100%; }
  body { background: #000; color: #fff; overflow: hidden; }
  body.use-custom-cursor, body.use-custom-cursor * { cursor: none !important; }
  .hidden { display: none !important; }

  .custom-cursor {
    position: fixed; width: 36px; height: 36px; pointer-events: none; z-index: 9999;
    background: url('assets/custom_cursor.png') no-repeat center / contain;
    transform: translate(-50%, -50%);
  }
  .cursor-trail-dot {
    position: fixed; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; z-index: 9998;
    background: var(--primary-color); box-shadow: 0 0 8px var(--primary-color);
  }

  #background, #background-img {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
    z-index: 0; pointer-events: none;
    filter: blur(var(--bg-blur, 6px)); transform: scale(1.08);
  }

  #start-screen {
    position: fixed; inset: 0; z-index: 30; cursor: pointer;
    background: rgba(0,0,0,.9); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
  }
  #start-text { font-size: 24px; padding: 0 20px; text-align: center; }

  .container {
    position: relative; z-index: 5; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 16px;
  }

  #profile-block {
    width: 640px; max-width: 100%;
    background: rgba(0,0,0,.21); border: 1px solid rgba(255,255,255,.2);
    border-radius: 15px; padding: 20px; backdrop-filter: blur(2.1px);
    display: flex; flex-direction: column; gap: 15px;
    opacity: 0; transform-style: preserve-3d;
    box-shadow: 0 0 30px color-mix(in srgb, var(--primary-color) 20%, transparent);
    transition: border-color .5s, box-shadow .5s;
  }

  .profile-header { display: flex; align-items: center; gap: 18px; }
  .profile-container { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
  .profile-container::after {
    content: ''; position: absolute; inset: -5px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle at 12px 12px, var(--primary-color) 15%, transparent 25%);
    filter: blur(2px); animation: orbit 3s linear infinite;
  }
  .profile-container.fast-orbit::after { animation: orbit .5s linear; }
  .profile-picture {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; cursor: pointer;
    border: 3px solid var(--purple); box-shadow: 0 0 18px var(--purple);
  }

  .profile-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .name-and-badges { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  #profile-name {
    font-size: 32px; font-weight: bold; letter-spacing: 3px; min-height: 1.2em;
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,.6), 0 0 14px var(--purple), 0 0 28px color-mix(in srgb, var(--purple) 60%, transparent);
  }
  #profile-bio { color: var(--purple-text); font-size: 17px; line-height: 1.5; min-height: 1.5em; }

  .badge-box { background: rgba(255,255,255,.15); padding: 2px; border-radius: 15px; }
  .badge-group {
    background: rgba(0,0,0,.5); border-radius: 12px; padding: 5px 8px;
    display: flex; gap: 8px; box-shadow: inset 0 0 10px rgba(255,255,255,.2);
  }
  .badge-container { position: relative; }
  .badge { width: 22px; height: 22px; transition: transform .3s; display: block; }
  .badge:hover { transform: scale(1.2); }
  .tooltip {
    visibility: hidden; opacity: 0; position: absolute; bottom: 130%; left: 50%;
    transform: translateX(-50%); white-space: nowrap; font-size: 12px;
    background: rgba(0,0,0,.85); padding: 4px 8px; border-radius: 6px; transition: opacity .3s; z-index: 100;
  }
  .badge-container:hover .tooltip, .visitor-counter:hover .tooltip { visibility: visible; opacity: 1; }

  .bio-separator { height: 1px; background: rgba(255,255,255,.2); }

  .profile-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  #social-links { display: flex; gap: 14px; flex-wrap: wrap; }
  #social-links a { display: block; }
  .social-icon {
    width: 30px; height: 30px; display: block; filter: invert(1) drop-shadow(0 0 6px rgba(255,255,255,.6));
    transition: transform .3s;
  }
  .social-icon:hover { transform: scale(1.35) rotateY(15deg); }

  .visitor-counter {
    position: relative; display: flex; align-items: center; gap: 8px; font-size: 14px;
    background: rgba(255,255,255,.1); padding: 7px 14px; border-radius: 20px;
  }
  .visitor-icon { width: 18px; height: 18px; stroke: var(--primary-color); }

  .panel {
    display: flex; align-items: center; gap: 12px; opacity: 0;
    background: rgba(0,0,0,.7); padding: 6px 12px; border-radius: 20px; backdrop-filter: blur(5px);
  }
  .panel.show { opacity: 1; transition: opacity 1s .5s; }
  .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl svg { width: 20px; height: 20px; stroke: var(--primary-color); cursor: pointer; }
  .slider {
    -webkit-appearance: none; appearance: none; width: 80px; height: 5px; border-radius: 5px;
    background: rgba(255,255,255,.3); outline: none;
  }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; }
  .slider::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 0; }
  .theme-button {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,.3); background: rgba(0,0,0,.5); transition: .3s;
  }
  .theme-button:hover { transform: scale(1.1); border-color: rgba(255,255,255,.8); }

  .glitch { animation: glitch .2s ease-in-out; }
  @keyframes glitch {
    20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px,-2px); }
    60% { transform: translate(2px, 2px); }  80% { transform: translate(2px,-2px); }
  }
  @keyframes orbit { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .profile-header { flex-direction: column; text-align: center; }
    .profile-container { width: 110px; height: 110px; }
    .profile-info { align-items: center; }
    .name-and-badges { justify-content: center; }
    #profile-name { font-size: 24px; letter-spacing: 2px; }
    #profile-bio { font-size: 14px; }
    .profile-footer { justify-content: center; }
    #start-text { font-size: 18px; }
    .slider { width: 60px; }
  }
</style>
</head>
<body>
  <div class="custom-cursor"></div>

  <div id="start-screen"><div id="start-text"></div></div>

  <div id="bg-wrap">
    <video id="background" autoplay loop muted playsinline webkit-playsinline></video>
    <img id="background-img" class="hidden" alt="">
  </div>
  <audio id="music" loop></audio>

  <div class="container">
    <div id="profile-block">
      <div class="profile-header">
        <div class="profile-container">
          <img alt="avatar" class="profile-picture">
        </div>
        <div class="profile-info">
          <div class="name-and-badges">
            <div id="profile-name"></div>
            <div class="badge-box" id="badge-box"><div class="badge-group" id="badge-group"></div></div>
          </div>
          <div id="profile-bio"></div>
        </div>
      </div>

      <div class="bio-separator"></div>

      <div class="profile-footer">
        <div id="social-links"></div>
        <div class="visitor-counter" id="visitor-counter">
          <svg class="visitor-icon" viewBox="0 0 24 24" fill="none">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          <span id="visitor-count">…</span>
          <span class="tooltip">Visitors</span>
        </div>
      </div>
    </div>

    <div class="panel" id="sound-panel">
      <div class="ctrl">
        <svg id="volume-icon" viewBox="0 0 24 24" fill="none">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
        </svg>
        <input id="volume-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.1">
      </div>
      <div class="ctrl">
        <svg viewBox="0 0 24 24" fill="none">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
        <input id="transparency-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.21">
      </div>
    </div>

    <div class="panel" id="theme-controls"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
const CONFIG = {
  name: "xNae",
  pageTitle: "xnae",
  startText: "click to enter",
  bio: [
    "welcome to my page",
    "i'm lost in the midst of mediocrity",
    "there's nothing to say about it"
  ],
  avatar: "assets/profile.gif",
  accent: "#a855f7",
  purple: "#a855f7",
  bioColor: "#d8b4fe",
  bgBlur: 6,

  socials: [
    { name: "Telegram",   icon: "telegram",   url: "https://t.me/zxcnape" },
    { name: "GitHub",     icon: "github",     url: "https://github.com/xNaee" },
    { name: "Steam",      icon: "steam",      url: "https://steamcommunity.com/profiles/76561199214460397/" },
    { name: "Discord",    icon: "discord",    url: "https://discordapp.com/users/517756387963699210" },
  ],

  badges: [],

  themes: [
    { background: "assets/background.mp4", music: "assets/background_music.mp3", color: "#a855f7" },
  ],

  volume: 0.1,
  cardOpacity: 0.21,

  viewsCounter: { namespace: "xnaee.github.io", key: "visitors" },

  customCursor: false,
  cursorTrail: true,
};

document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const startScreen = $('start-screen'), startText = $('start-text');
  const profileName = $('profile-name'), profileBio = $('profile-bio');
  const profileBlock = $('profile-block'), video = $('background');
  const bgImg = $('background-img'), bgWrap = $('bg-wrap');
  const music = $('music'), volumeIcon = $('volume-icon');
  const volumeSlider = $('volume-slider'), transparencySlider = $('transparency-slider');
  const profilePicture = document.querySelector('.profile-picture');
  const profileContainer = document.querySelector('.profile-container');
  const isTouch = matchMedia('(pointer: coarse)').matches;

  document.title = CONFIG.pageTitle;
  volumeSlider.value = CONFIG.volume;
  transparencySlider.value = CONFIG.cardOpacity;
  profilePicture.src = CONFIG.avatar;
  document.documentElement.style.setProperty('--primary-color', CONFIG.accent);
  document.documentElement.style.setProperty('--purple', CONFIG.purple);
  document.documentElement.style.setProperty('--purple-text', CONFIG.bioColor);
  document.documentElement.style.setProperty('--bg-blur', CONFIG.bgBlur + 'px');

  const socials = $('social-links');
  CONFIG.socials.forEach(s => {
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; a.title = s.name;
    a.innerHTML = `<img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/${s.icon}.svg" alt="${s.name}" class="social-icon">`;
    socials.appendChild(a);
  });

  if (CONFIG.badges.length) {
    const group = $('badge-group');
    CONFIG.badges.forEach(b => {
      group.insertAdjacentHTML('beforeend',
        `<div class="badge-container"><img src="${b.img}" alt="${b.title}" class="badge"><span class="tooltip">${b.title}</span></div>`);
    });
  } else {
    $('badge-box').classList.add('hidden');
  }

  const VIDEO_RE = /\.(mp4|webm|mov|ogg)$/i;
  function setBackground(path) {
    const base = path.replace(/\.[a-z0-9]+$/i, '');
    const exts = ['jpg','jpeg','png','webp','gif','mp4','webm','mov'];
    const tries = [path, ...exts.flatMap(e => [base + '.' + e, base + '.' + e.toUpperCase()])]
      .filter((v, i, a) => a.indexOf(v) === i);
    let n = 0;
    (function next() {
      if (n >= tries.length) { console.warn('Background not found:', path); return; }
      const src = tries[n++];
      if (VIDEO_RE.test(src)) {
        bgImg.classList.add('hidden'); video.classList.remove('hidden');
        video.onerror = next; video.src = src;
        video.play().catch(() => {});
      } else {
        video.pause(); video.onerror = null; video.removeAttribute('src'); video.classList.add('hidden');
        bgImg.onerror = next;
        bgImg.onload = () => { bgImg.onerror = null; bgImg.classList.remove('hidden'); };
        bgImg.src = src;
      }
    })();
  }

  let currentTheme = 0;
  function loadTheme(i, autoplay) {
    const t = CONFIG.themes[i];
    currentTheme = i;
    document.documentElement.style.setProperty('--primary-color', t.color || CONFIG.accent);
    setBackground(t.background || t.video);
    music.src = t.music;
    music.volume = volumeSlider.value;
    if (autoplay) music.play().catch(() => {});
  }
  loadTheme(0, false);

  const controls = $('theme-controls');
  if (CONFIG.themes.length > 1) {
    CONFIG.themes.forEach((t, i) => {
      const b = document.createElement('div');
      b.className = 'theme-button'; b.textContent = i + 1;
      b.onclick = () => {
        if (i === currentTheme) return;
        gsap.to(bgWrap, { opacity: 0, duration: .4, onComplete: () => {
          loadTheme(i, true);
          gsap.to(bgWrap, { opacity: 1, duration: .4 });
        }});
      };
      controls.appendChild(b);
    });
  } else {
    controls.classList.add('hidden');
  }

  const cursor = document.querySelector('.custom-cursor');
  if (CONFIG.customCursor && !isTouch) {
    document.body.classList.add('use-custom-cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
    });
  } else {
    cursor.remove();
  }

  function startTrail() {
    const dots = [];
    for (let i = 0; i < 12; i++) {
      const d = document.createElement('div');
      d.className = 'cursor-trail-dot';
      d.style.opacity = 1 - i / 12;
      d.style.transform = `translate(-50%,-50%) scale(${1 - i / 14})`;
      document.body.appendChild(d);
      dots.push({ el: d, x: 0, y: 0 });
    }
    let mx = 0, my = 0;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    (function loop() {
      let x = mx, y = my;
      dots.forEach(d => {
        d.x += (x - d.x) * 0.35; d.y += (y - d.y) * 0.35;
        d.el.style.left = d.x + 'px'; d.el.style.top = d.y + 'px';
        x = d.x; y = d.y;
      });
      requestAnimationFrame(loop);
    })();
  }

  let startTyped = '', blink = true;
  (function typeStart(i = 0) {
    if (i <= CONFIG.startText.length) {
      startTyped = CONFIG.startText.slice(0, i);
      setTimeout(() => typeStart(i + 1), 90);
    }
  })();
  const startBlink = setInterval(() => {
    blink = !blink;
    startText.textContent = startTyped + (blink ? '|' : ' ');
  }, 500);

  function typeLoop(el, lines, speed, pause) {
    let li = 0, ci = 0, del = false, text = '', cur = true;
    setInterval(() => { cur = !cur; el.textContent = text + (cur ? '|' : ' '); }, 500);
    (function step() {
      const line = lines[li];
      if (!del && ci < line.length) ci++;
      else if (!del) { del = true; return setTimeout(step, pause); }
      else if (ci > 0) ci--;
      else { del = false; li = (li + 1) % lines.length; }
      text = line.slice(0, ci);
      el.textContent = text + (cur ? '|' : ' ');
      setTimeout(step, del ? speed / 2 : speed);
    })();
  }

  function typeOnce(el, line, speed) {
    let ci = 0, cur = true;
    const blinkId = setInterval(() => { cur = !cur; el.textContent = line.slice(0, ci) + (cur ? '|' : ' '); }, 500);
    (function step() {
      ci++;
      el.textContent = line.slice(0, ci) + '|';
      if (ci < line.length) setTimeout(step, speed);
      else setTimeout(() => { clearInterval(blinkId); el.textContent = line; }, 1500);
    })();
  }

  startScreen.addEventListener('click', () => {
    clearInterval(startBlink);
    gsap.to(startScreen, { opacity: 0, duration: .5, onComplete: () => startScreen.classList.add('hidden') });
    music.muted = false;
    music.play().catch(() => {});
    gsap.fromTo(profileBlock, { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 1, ease: 'power2.out' });
    if (CONFIG.cursorTrail && !isTouch) startTrail();
    typeOnce(profileName, CONFIG.name, 200);
    typeLoop(profileBio, CONFIG.bio, 110, 2000);
  }, { once: true });

  const ICON_ON = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>`;
  const ICON_OFF = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>`;
  volumeIcon.addEventListener('click', () => {
    music.muted = !music.muted;
    volumeIcon.innerHTML = music.muted ? ICON_OFF : ICON_ON;
  });
  volumeSlider.addEventListener('input', () => {
    music.volume = volumeSlider.value;
    music.muted = false;
    volumeIcon.innerHTML = ICON_ON;
  });

  transparencySlider.addEventListener('input', () => {
    const o = +transparencySlider.value;
    profileBlock.style.background = `rgba(0,0,0,${o})`;
    profileBlock.style.backdropFilter = o ? `blur(${10 * o}px)` : 'none';
    profileBlock.style.borderColor = o ? '' : 'transparent';
  });

  transparencySlider.dispatchEvent(new Event('input'));

  if (!isTouch) {
    profileBlock.addEventListener('mousemove', e => {
      const r = profileBlock.getBoundingClientRect();
      gsap.to(profileBlock, {
        rotationX: ((e.clientY - r.top - r.height / 2) / r.height) * 15,
        rotationY: -((e.clientX - r.left - r.width / 2) / r.width) * 15,
        duration: .3, ease: 'power2.out', transformPerspective: 1000,
      });
    });
    profileBlock.addEventListener('mouseleave', () =>
      gsap.to(profileBlock, { rotationX: 0, rotationY: 0, duration: .5 }));
  }

  profilePicture.addEventListener('click', () => {
    profileContainer.classList.remove('fast-orbit');
    void profileContainer.offsetWidth;
    profileContainer.classList.add('fast-orbit');
    setTimeout(() => profileContainer.classList.remove('fast-orbit'), 500);
  });

  const counter = $('visitor-counter');
  if (CONFIG.viewsCounter) {
    const { namespace, key } = CONFIG.viewsCounter;
    const API = 'https://abacus.jasoncameron.dev';
    const flag = 'counted-' + namespace + '-' + key;
    let seen = false;
    try { seen = localStorage.getItem(flag) === '1'; } catch (e) {}
    const path = (seen ? '/get/' : '/hit/') + encodeURIComponent(namespace) + '/' + encodeURIComponent(key);
    fetch(API + path)
      .then(r => r.json())
      .then(d => {
        if (typeof d.value !== 'number') throw d;
        $('visitor-count').textContent = d.value.toLocaleString('en-US');
        try { localStorage.setItem(flag, '1'); } catch (e) {}
      })
      .catch(err => { console.warn('Visitor counter failed:', err); counter.classList.add('hidden'); });
  } else {
    counter.classList.add('hidden');
  }
});
</script>
  <script>
    document.getElementById('start-screen').addEventListener('click', () =>
      document.querySelectorAll('.panel').forEach(p => p.classList.add('show')), { once: true });
</script>
</body>
</html>
